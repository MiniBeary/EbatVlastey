name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/EbatVlastey.Tests -c Release -- --browsers
  build:
    needs: test
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: ./scripts/build.ps1
      - shell: pwsh
        run: |
          $p = Start-Process ./artifacts/EbatVlastey-win-x64.exe -ArgumentList '--self-test --report artifacts/exe-self-test.json' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'EXE self-test failed' }
          if (-not (Test-Path ./artifacts/exe-self-test.json)) { throw 'Self-test report missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EbatVlastey-win-x64
          path: |
            artifacts/EbatVlastey-win-x64.exe
            artifacts/SHA256SUMS.txt
            artifacts/exe-self-test.json
